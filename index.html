const t=()=>translations[lang];
const locale=()=>lang==="en"?"en-GB":lang==="ar"?"ar":lang==="ru"?"ru-RU":"de-DE";
const money=c=>(c/100).toLocaleString(locale(),{style:"currency",currency:"EUR"});
const dec=v=>v.toLocaleString(locale(),{minimumFractionDigits:1,maximumFractionDigits:1});
const dayText=d=>d+" "+(d===1?t().day:t().days);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function total(ids=[...selected]){
 const r={kcal:0,cents:0,starSum:0,days:Infinity,count:0,ids:[...ids]};
 ids.forEach(i=>{const p=products[i];if(!p)return;r.count++;r.kcal+=p.kcal;r.cents+=p.cents;r.starSum+=p.stars;r.days=Math.min(r.days,p.days)});
 if(!r.count)r.days=0;
 r.avg=r.count?r.starSum/r.count:0;
 r.mH=!r.count?0:r.starSum>=RULES.health[0]*r.count?3:r.starSum>=RULES.health[1]*r.count?2:r.starSum>=RULES.health[2]*r.count?1:0;
 r.mP=!r.count?0:r.cents<=RULES.price[0]?3:r.cents<=RULES.price[1]?2:r.cents<=RULES.price[2]?1:0;
 r.mS=!r.count?0:r.days>=RULES.shelf[0]?3:r.days>=RULES.shelf[1]?2:r.days>=RULES.shelf[2]?1:0;
 r.points=r.mH+r.mP+r.mS;
 r.valid=r.kcal>=MIN&&r.kcal<=MAX&&r.count<=MAX_ITEMS;
 return r;
}
/* Rangfolge: Punkte, dann mehr Sterne, dann günstiger, dann länger haltbar */
function better(a,b){
 return b.points-a.points||b.avg-a.avg||a.cents-b.cents||b.days-a.days;
}
function medalIcon(m){return m===3?"🥇":m===2?"🥈":m===1?"🥉":"–"}
function medalName(m){const x=t();return m===3?x.gold:m===2?x.silver:m===1?x.bronze:x.noMedal}

function bestSolution(){
 if(solutionCache)return solutionCache;
 let best=null;const n=products.length,pick=[];
 (function dfs(start,kcal){
  if(kcal>=MIN){
   const r=total(pick);
   if(!best||better(r,best)<0)best=r;
  }
  if(pick.length===MAX_ITEMS)return;
  for(let i=start;i<n;i++){
   if(kcal+products[i].kcal>MAX)continue;
   pick.push(i);dfs(i+1,kcal+products[i].kcal);pick.pop();
  }
 })(0,0);
 return solutionCache=best;
}

function applyLanguage(){
 const x=t();
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 const labels={pageTitle:x.page,levelTitle:x.title,quizLevelTitle:x.title,gameHeading:x.title,rulesHeading:x.rulesHeading,
  startButton:x.start,quizCheck:x.check,quizQuestion:x.quizQuestion,quizSub:x.quizSub,
  calorieLabel:x.calories,healthLabel:x.health+" ("+x.avgStars+")",priceLabel:x.price,shelfLabel:x.shelf,
  clearButton:x.clear,nextButton:x.finish,hintLabel:x.tips,nameHeading:x.nameHeading,nameInstructions:x.nameInstructions,
  nameLabel:x.nameLabel,submitScore:x.save,skipSave:x.skip,finalHeading:x.final,finalInstructions:x.finalInstructions,
  compareHeading:x.compare,leaderboardHeading:x.leaderboard,restartButton:x.restart};
 Object.entries(labels).forEach(([id,text])=>$(id).textContent=text);
 $("task").textContent="❗ "+x.task;$("quizTask").textContent="❗ "+x.task;
 $("playerName").placeholder=x.namePlaceholder;
 document.querySelectorAll(".language-buttons button").forEach(b=>{
  const on=b.dataset.language===lang;b.classList.toggle("active",on);b.setAttribute("aria-pressed",String(on));
 });
 renderRules();
 if(!$("quizScreen").hidden)renderQuizOptions();
 if(!$("game").hidden)renderGame();
 if(!$("hintPopup").hidden)renderHint();
 if(!$("finalScreen").hidden)renderFinal(false);
}
function renderRules(){
 const x=t(),R=RULES;
 const row=(name,cells)=>"<tr><td>"+esc(name)+"</td>"+cells.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>";
 $("rulesTable").innerHTML="<thead><tr><th></th><th>🥇 "+esc(x.gold)+"</th><th>🥈 "+esc(x.silver)+"</th><th>🥉 "+esc(x.bronze)+"</th></tr></thead><tbody>"+
  row(x.ruleHealth,R.health.map(v=>x.atLeast+" "+dec(v)+" ★"))+
  row(x.rulePrice,R.price.map(v=>x.atMost+" "+money(v)))+
  row(x.ruleShelf,R.shelf.map(v=>x.atLeast+" "+dayText(v)))+"</tbody>";
}
function show(ids){
 ["startScreen","quizScreen","game","actionBar","hintFloat","hintPopup","nameGate","finalScreen"].forEach(id=>$(id).hidden=!ids.includes(id));
 $("hintFloat").setAttribute("aria-expanded","false");
 window.scrollTo(0,0);
}
function renderQuizOptions(){
 const x=t(),box=$("quizOptions");box.replaceChildren();
 x.quizOptions.forEach((text,i)=>{
  const b=document.createElement("button");b.type="button";b.textContent=text;
  b.setAttribute("aria-pressed",String(quizPick.has(i)));
  b.addEventListener("click",()=>{
   if(quizPick.has(i))quizPick.delete(i);else quizPick.add(i);
   b.setAttribute("aria-pressed",String(quizPick.has(i)));
   box.querySelectorAll("button").forEach(o=>o.classList.remove("wrong","right"));
   $("quizFeedback").textContent="";$("quizFeedback").className="";
  });
  box.appendChild(b);
 });
}
function startQuiz(){
 quizPick.clear();$("quizFeedback").textContent="";$("quizFeedback").className="";$("quizCheck").disabled=false;
 show(["quizScreen"]);renderQuizOptions();
}
function checkQuiz(){
 const ok=quizPick.size===3&&[1,2,3].every(i=>quizPick.has(i));
 const fb=$("quizFeedback"),buttons=$("quizOptions").querySelectorAll("button");
 if(ok){
  buttons.forEach((b,i)=>{if(quizPick.has(i))b.classList.add("right");b.disabled=true});
  fb.className="right";fb.textContent=t().quizRight;$("quizCheck").disabled=true;
  setTimeout(()=>{show(["game","actionBar","hintFloat"]);renderGame()},900);
 }else{
  buttons.forEach((b,i)=>{if(quizPick.has(i)&&i===0)b.classList.add("wrong")});
  fb.className="wrong";fb.textContent=t().quizWrong;
 }
}
function renderProducts(){
 const x=t(),box=$("products"),sum=total();
 box.replaceChildren();
 x.groups.forEach((groupName,g)=>{
  const h=document.createElement("h3");h.className="group-title";h.textContent=groupName;
  const grid=document.createElement("div");grid.className="grid";
  products.forEach((p,i)=>{
   if(p.g!==g)return;
   const label=document.createElement("label");label.className="product";
   const input=document.createElement("input");input.type="checkbox";input.checked=selected.has(i);
   input.disabled=!input.checked&&(sum.kcal+p.kcal>MAX||sum.count>=MAX_ITEMS);
   input.addEventListener("change",()=>{
    if(input.checked)selected.add(i);else selected.delete(i);
    renderProducts();renderSummary();
   });
   const pic=document.createElement("span");pic.className="product-img";pic.innerHTML=picture(i);
   const info=document.createElement("span");info.className="product-info";
   const name=document.createElement("span");name.className="product-name";name.textContent=x.products[i];
   const detail=document.createElement("span");detail.className="details";
   detail.textContent=p.kcal+" "+x.calories+" · "+money(p.cents)+" · "+x.shelf+": "+dayText(p.days);
   const stars=document.createElement("span");stars.className="stars";
   stars.textContent=x.healthStars+" "+"★".repeat(p.stars)+"☆".repeat(5-p.stars);
   info.append(name,detail,stars);label.append(input,pic,info);grid.appendChild(label);
  });
  box.append(h,grid);
 });
}
function renderSummary(){
 const x=t(),r=total();
 $("productsHeading").textContent=x.productsTitle+" ("+r.count+"/"+MAX_ITEMS+" "+x.inBox+")";
 $("calories").textContent=r.kcal+" "+x.calories;
 $("calorieFill").style.width=Math.min(100,r.kcal/MAX*100)+"%";
 $("calorieFill").style.backgroundColor=r.kcal>=MIN?"#79bd83":"#f2bd57";
 $("calorieMeter").setAttribute("aria-valuenow",r.kcal);
 $("health").textContent=r.count?dec(r.avg)+" ★":"–";
 $("price").textContent=money(r.cents);
 $("shelfLife").textContent=r.count?dayText(r.days):"–";
 [["statHealth","healthMedal",r.mH],["statPrice","priceMedal",r.mP],["statShelf","shelfMedal",r.mS]].forEach(([box,line,m])=>{
  $(box).className="stat"+(m&&r.count?" m"+m:"");
  $(line).textContent=r.count?medalIcon(m)+" "+medalName(m):"";
 });
 $("points").textContent=x.pointsLabel+": "+r.points+"/9";
 const goal=$("goal");
 if(r.kcal>=MIN&&r.kcal<=MAX){goal.textContent=x.goal+(r.count>=MAX_ITEMS?" "+x.full:"");goal.classList.add("reached")}
 else if(r.kcal<MIN){goal.textContent=x.short.replace("{n}",MIN-r.kcal)+(r.count>=MAX_ITEMS?" "+x.full:"");goal.classList.remove("reached")}
 else{goal.textContent=x.tooMany;goal.classList.remove("reached")}
 $("nextButton").disabled=!r.valid;
}
function renderGame(){renderProducts();renderSummary()}
function renderHint(){
 const box=$("hintPopup");box.replaceChildren();
 t().hint.forEach(text=>{const p=document.createElement("p");p.textContent="💡 "+text;box.appendChild(p)});
}
function headerRow(){
 const x=t();
 return "<colgroup>"+"<col>".repeat(7)+"</colgroup><thead><tr>"+[x.colWho,x.colProducts,x.calories,x.price,x.avgStars,x.shelf,x.colPoints]
  .map(h=>'<th scope="col">'+esc(h)+"</th>").join("")+"</tr></thead>";
}
function resultRow(who,ids,mine){
 const x=t(),clean=ids.filter(i=>Number.isInteger(i)&&products[i]),r=total(clean);
 const icons='<div class="icon-list">'+clean.map(i=>'<span class="icon-item">'+picture(i)+"<span>"+esc(x.products[i])+"</span></span>").join("")+"</div>";
 return '<tr'+(mine?' class="mine"':"")+"><td>"+esc(who)+"</td><td>"+icons+"</td><td>"+r.kcal+"</td><td>"+esc(money(r.cents))+" "+medalIcon(r.mP)+
  "</td><td>"+esc(dec(r.avg))+" ★ "+medalIcon(r.mH)+"</td><td>"+esc(dayText(r.days))+" "+medalIcon(r.mS)+"</td><td>"+r.points+"/9</td></tr>";
}
function renderFinal(load=true){
 const x=t(),sol=bestSolution();
 $("ownTable").innerHTML=headerRow()+"<tbody>"+resultRow(x.you,finalIds,true)+(sol?resultRow(x.solution,sol.ids,false):"")+"</tbody>";
 $("merke").innerHTML="<h3>✅ "+esc(x.merkeTitle)+"</h3>"+x.merke.map(p=>"<p>"+esc(p)+"</p>").join("");
 if(load)loadLeaderboard();else if(lastRows)renderBoard(lastRows);
}
let lastRows=null;
async function loadLeaderboard(){
 const status=$("leaderboardStatus");status.hidden=true;
 try{
  const res=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?select=player,selections,created_at&order=created_at.asc&limit=10000",
   {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  if(!res.ok)throw new Error("load");
  const rows=await res.json();
  lastRows=rows.map(row=>{
   if(!Array.isArray(row.selections))return null;
   const s=row.selections.find(e=>e&&e.level===LEVEL_ID&&Array.isArray(e.ids));
   if(!s)return null;
   const ids=[...new Set(s.ids.filter(i=>Number.isInteger(i)&&products[i]))];
   const r=total(ids);
   return r.valid?{player:row.player||"?",ids,r,time:new Date(row.created_at)}:null;
  }).filter(Boolean);
  renderBoard(lastRows);
 }catch(e){
  lastRows=null;$("statCards").replaceChildren();
  $("topTable").innerHTML="";
  status.textContent=t().loadError;status.hidden=false;
 }
}
function renderBoard(entries){
 const x=t(),n=entries.length;
 const card=(num,label)=>'<div class="stat-card"><strong>'+num+"</strong><span>"+esc(label)+"</span></div>";
 const cnt=f=>entries.filter(f).length+"/"+n;
 $("statCards").innerHTML=card(n,x.cardAll)+card(cnt(e=>e.r.points===9),x.cardGold3)+
  card(cnt(e=>e.r.mH===3),x.cardGoldH)+card(cnt(e=>e.r.mP===3),x.cardGoldP)+card(cnt(e=>e.r.mS===3),x.cardGoldS);
 const top=[...entries].sort((a,b)=>better(a.r,b.r)||a.time-b.time).slice(0,5);
 $("topTable").innerHTML=headerRow()+"<tbody>"+(top.length?top.map((e,i)=>resultRow("#"+(i+1)+" "+e.player,e.ids,false)).join("")
  :'<tr><td colspan="7">'+esc(x.empty)+"</td></tr>")+"</tbody>";
}
async function submitResults(){
 const name=$("playerName").value.trim(),x=t();
 if(!name){$("scoreStatus").textContent=x.enterName;$("playerName").focus();return}
 if(submitted)return;
 const button=$("submitScore");button.disabled=true;$("scoreStatus").textContent=x.saving;
 try{
  const res=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{method:"POST",
   headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},
   body:JSON.stringify({player:name.slice(0,24),selections:[{level:LEVEL_ID,ids:finalIds}]})});
  if(!res.ok)throw new Error("save");
  submitted=true;show(["finalScreen"]);renderFinal();
 }catch(e){
  button.disabled=false;$("scoreStatus").textContent=t().saveError;$("skipSave").hidden=false;
 }
}
function finishBox(){
 const r=total();if(!r.valid)return;
 finalIds=[...selected].sort((a,b)=>a-b);
 show(["nameGate"]);$("scoreStatus").textContent="";$("submitScore").disabled=false;$("skipSave").hidden=true;$("playerName").focus();
}
document.querySelectorAll(".language-buttons button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.language;applyLanguage()}));
$("startButton").addEventListener("click",startQuiz);
$("quizCheck").addEventListener("click",checkQuiz);
$("hintFloat").addEventListener("click",()=>{
 const popup=$("hintPopup");
 if(!popup.hidden){popup.hidden=true;$("hintFloat").setAttribute("aria-expanded","false");return}
 renderHint();popup.hidden=false;$("hintFloat").setAttribute("aria-expanded","true");
});
$("clearButton").addEventListener("click",()=>{selected.clear();renderGame()});
$("nextButton").addEventListener("click",finishBox);
$("submitScore").addEventListener("click",submitResults);
$("playerName").addEventListener("keydown",e=>{if(e.key==="Enter")submitResults()});
$("skipSave").addEventListener("click",()=>{show(["finalScreen"]);renderFinal()});
$("restartButton").addEventListener("click",()=>{selected.clear();submitted=false;finalIds=[];$("playerName").value="";show(["startScreen"])});
applyLanguage();show(["startScreen"]);
}
</script>
</body>
</html>
